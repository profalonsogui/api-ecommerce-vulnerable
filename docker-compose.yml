services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce_lab_postgres
    restart: "no"
    environment:
      POSTGRES_USER: lab_user
      POSTGRES_PASSWORD: lab_password
      POSTGRES_DB: ecommerce_lab
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - ecommerce_lab_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_user -d ecommerce_lab"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  ecommerce_lab_data:
